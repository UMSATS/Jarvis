name: jarvis-backend
services:
  api:
    container_name: api
    image: jarvis-api:latest
    build:
      context: .
    ports:
      - "5000:5000"
    links:
      - influxdb
    volumes:
      - .:/app
    restart: always
    environment:
      DB_HOST: influxdb
      DB_PORT: 8086
      DB_URL: http://localhost:8086
      DB_USER: admin
      DB_PASS: adminPassword
      DB_TOKEN: umsatsAdminToken
  influxdb:
    container_name: influxdb
    image: influxdb:latest
    ports:
      - "8086:8086"
    volumes:
      - influxdb-storage:/var/lib/influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminPassword
      - DOCKER_INFLUXDB_INIT_ORG=umsats
      - DOCKER_INFLUXDB_INIT_BUCKET=jarvis
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=umsatsAdminToken
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "localhost:8086"]
      interval: 5s
      timeout: 10s
      retries: 120

volumes:
    influxdb-storage: