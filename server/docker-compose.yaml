name: jarvis-backend
services:
  api:
    container_name: api
    build: ./
    ports:
      - "5000:5000"
    links:
      - influxdb
    depends_on:
      influxdb:
        condition: service_healthy
        restart: true
    environment:
      DB_HOST: localhost:8086
      DB_USER: admin
      DB_PASS: adminPassword

  influxdb:
    container_name: influxdb
    image: influxdb:latest
    ports:
      - "8086:8086"
    volumes:
      - influxdb-storage:/var/lib/influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminPassword
      - DOCKER_INFLUXDB_INIT_ORG=umsats
      - DOCKER_INFLUXDB_INIT_BUCKET=my-bucket
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "localhost:8086"]
      interval: 5s
      timeout: 10s
      retries: 120

volumes:
    influxdb-storage: